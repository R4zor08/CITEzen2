<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var pref = localStorage.getItem('citezen_theme_preference');
          var userSet = localStorage.getItem('citezen_theme_user_set') === 'true';
          var resolved = 'light';
          if (pref === 'system') {
            var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            resolved = systemDark ? 'dark' : 'light';
          } else if (pref === 'dark' || pref === 'light') {
            resolved = pref;
          } else if (userSet) {
            var stored = localStorage.getItem('citezen_theme');
            if (stored === 'dark' || stored === 'light') {
              resolved = stored;
            }
          }
          if (resolved === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('light');
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png?v=2" />
    <link rel="apple-touch-icon" href="/favicon-192.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CITEzen</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
